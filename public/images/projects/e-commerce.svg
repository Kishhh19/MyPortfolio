<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEcom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgEcom)"/>
  
  <!-- Browser Frame -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Browser Header -->
  <path d="M20 32 C20 25.37 25.37 20 32 20 L768 20 C774.63 20 780 25.37 780 32 L780 60 L20 60 Z" fill="#1e293b"/>
  <circle cx="45" cy="40" r="6" fill="#ef4444"/>
  <circle cx="65" cy="40" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="40" r="6" fill="#10b981"/>
  
  <rect x="120" y="30" width="380" height="22" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="140" y="45" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">https://inventory-app.dev/admin/catalog</text>

  <!-- Top bar -->
  <rect x="20" y="60" width="760" height="50" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="45" y="90" fill="#2dd4bf" font-family="'Inter', sans-serif" font-weight="bold" font-size="15">STORE &amp; INVENTORY MANAGEMENT</text>
  <rect x="620" y="70" width="130" height="30" rx="6" fill="#14b8a6"/>
  <text x="685" y="90" fill="#090d16" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+ Add Product</text>

  <!-- Grid of Product Cards -->
  <g transform="translate(45, 130)">
    <!-- Product 1 -->
    <rect x="0" y="0" width="220" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="60" height="60" rx="6" fill="#0f172a" stroke="#2dd4bf" stroke-width="1"/>
    <text x="45" y="52" fill="#2dd4bf" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">💻</text>
    <text x="90" y="35" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="bold" font-size="13">Dev Laptop X1</text>
    <text x="90" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">₱54,990.00</text>
    <text x="90" y="72" fill="#10b981" font-family="'Inter', sans-serif" font-size="10">Stock: 14 units</text>
    
    <rect x="15" y="95" width="190" height="36" rx="4" fill="#0f172a"/>
    <text x="25" y="118" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">SKU: DEV-LAP-01</text>

    <!-- Product 2 -->
    <g transform="translate(245, 0)">
      <rect x="0" y="0" width="220" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="15" y="15" width="60" height="60" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
      <text x="45" y="52" fill="#a855f7" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">⌨️</text>
      <text x="90" y="35" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="bold" font-size="13">Mech Keyboard</text>
      <text x="90" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">₱3,499.00</text>
      <text x="90" y="72" fill="#10b981" font-family="'Inter', sans-serif" font-size="10">Stock: 48 units</text>
      
      <rect x="15" y="95" width="190" height="36" rx="4" fill="#0f172a"/>
      <text x="25" y="118" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">SKU: ACC-KEY-75</text>
    </g>

    <!-- Product 3 -->
    <g transform="translate(490, 0)">
      <rect x="0" y="0" width="220" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="15" y="15" width="60" height="60" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <text x="45" y="52" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">🖥️</text>
      <text x="90" y="35" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="bold" font-size="13">27" 4K Monitor</text>
      <text x="90" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">₱18,250.00</text>
      <text x="90" y="72" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="10">Low Stock: 3 units</text>
      
      <rect x="15" y="95" width="190" height="36" rx="4" fill="#0f172a"/>
      <text x="25" y="118" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">SKU: MON-4K-27</text>
    </g>

    <!-- Analytics / SQL Summary chart -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="710" height="150" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="28" fill="#e2e8f0" font-family="'Inter', sans-serif" font-weight="bold" font-size="13">Live Sales Transactions &amp; Database Sync</text>
      
      <!-- Bars graph -->
      <line x1="30" y1="120" x2="680" y2="120" stroke="#334155" stroke-width="1"/>
      
      <rect x="60" y="60" width="40" height="60" rx="4" fill="#14b8a6"/>
      <text x="80" y="138" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Mon</text>

      <rect x="150" y="45" width="40" height="75" rx="4" fill="#14b8a6"/>
      <text x="170" y="138" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Tue</text>

      <rect x="240" y="30" width="40" height="90" rx="4" fill="#2dd4bf"/>
      <text x="260" y="138" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Wed</text>

      <rect x="330" y="50" width="40" height="70" rx="4" fill="#14b8a6"/>
      <text x="350" y="138" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Thu</text>

      <rect x="420" y="20" width="40" height="100" rx="4" fill="#38bdf8"/>
      <text x="440" y="138" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Fri</text>

      <!-- Right summary metrics -->
      <g transform="translate(500, 40)">
        <text x="0" y="15" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">TOTAL REVENUE (WEEK)</text>
        <text x="0" y="40" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold">₱142,820.00</text>
        <text x="0" y="65" fill="#10b981" font-family="'Inter', sans-serif" font-size="11">▲ 18.4% vs last week</text>
      </g>
    </g>
  </g>
</svg>
