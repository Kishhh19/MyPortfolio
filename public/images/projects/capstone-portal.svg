<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPortal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgPortal)"/>
  
  <!-- Browser Window Frame -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Browser Header Bar -->
  <path d="M20 32 C20 25.37 25.37 20 32 20 L768 20 C774.63 20 780 25.37 780 32 L780 60 L20 60 Z" fill="#1e293b"/>
  <circle cx="45" cy="40" r="6" fill="#ef4444"/>
  <circle cx="65" cy="40" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="40" r="6" fill="#10b981"/>
  
  <!-- URL Bar -->
  <rect x="120" y="30" width="400" height="22" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="140" y="45" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">https://capstone-portal.local/dashboard</text>

  <!-- App Sidebar -->
  <rect x="20" y="60" width="180" height="420" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <text x="40" y="95" fill="#2dd4bf" font-family="'Inter', sans-serif" font-weight="bold" font-size="14">CAPSTONE SYSTEM</text>
  
  <!-- Sidebar Nav items -->
  <rect x="35" y="115" width="150" height="30" rx="6" fill="#1e293b"/>
  <text x="50" y="135" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12">📊 Dashboard</text>
  <text x="50" y="170" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">📁 Submissions</text>
  <text x="50" y="205" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">👥 Team Groups</text>
  <text x="50" y="240" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">📝 Rubrics & Grading</text>
  <text x="50" y="275" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">⚙️ System Settings</text>

  <!-- Main Content Area -->
  <g transform="translate(220, 80)">
    <!-- Header Banner -->
    <rect x="0" y="0" width="540" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="bold" font-size="16">Academic Capstone Management Portal</text>
    <text x="20" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Full-Stack Project Workflow, Manuscript Tracking & Adviser Review</text>

    <!-- 3 Stat Widgets -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="165" height="75" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.5"/>
      <text x="15" y="25" fill="#a5f3fc" font-family="'Inter', sans-serif" font-size="11">ACTIVE TEAMS</text>
      <text x="15" y="55" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="22">24 Groups</text>

      <rect x="185" y="0" width="165" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="200" y="25" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="11">SUBMISSIONS</text>
      <text x="200" y="55" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="22">98% On Time</text>

      <rect x="370" y="0" width="170" height="75" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>
      <text x="385" y="25" fill="#d8b4fe" font-family="'Inter', sans-serif" font-size="11">SYSTEM STATUS</text>
      <text x="385" y="55" fill="#34d399" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="18">● Production</text>
    </g>

    <!-- Table / List Preview -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="540" height="195" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="30" fill="#e2e8f0" font-family="'Inter', sans-serif" font-weight="bold" font-size="13">Recent Manuscript Milestone Submissions</text>
      
      <!-- Table Headers -->
      <line x1="20" y1="45" x2="520" y2="45" stroke="#334155" stroke-width="1"/>
      <text x="25" y="65" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">PROJECT TITLE</text>
      <text x="260" y="65" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">CHAPTER</text>
      <text x="380" y="65" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">STATUS</text>

      <!-- Row 1 -->
      <line x1="20" y1="80" x2="520" y2="80" stroke="#1e293b" stroke-width="1"/>
      <text x="25" y="102" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="12">Smart Attendance RFID Hub</text>
      <text x="260" y="102" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Chapter 3 - Methodology</text>
      <rect x="380" y="88" width="90" height="22" rx="4" fill="#065f46"/>
      <text x="425" y="103" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">APPROVED</text>

      <!-- Row 2 -->
      <line x1="20" y1="120" x2="520" y2="120" stroke="#1e293b" stroke-width="1"/>
      <text x="25" y="142" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="12">Campus E-Voting Security</text>
      <text x="260" y="142" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Chapter 4 - Results</text>
      <rect x="380" y="128" width="90" height="22" rx="4" fill="#854d0e"/>
      <text x="425" y="143" fill="#fde047" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">IN REVIEW</text>

      <!-- Row 3 -->
      <line x1="20" y1="160" x2="520" y2="160" stroke="#1e293b" stroke-width="1"/>
      <text x="25" y="180" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="12">Clinic Inventory & Queue</text>
      <text x="260" y="180" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Chapter 1-2 Intro</text>
      <rect x="380" y="167" width="90" height="20" rx="4" fill="#1e3a8a"/>
      <text x="425" y="181" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SUBMITTED</text>
    </g>
  </g>
</svg>
