<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCampus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgCampus)"/>
  
  <!-- Browser Frame -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Browser Header -->
  <path d="M20 32 C20 25.37 25.37 20 32 20 L768 20 C774.63 20 780 25.37 780 32 L780 60 L20 60 Z" fill="#1e293b"/>
  <circle cx="45" cy="40" r="6" fill="#ef4444"/>
  <circle cx="65" cy="40" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="40" r="6" fill="#10b981"/>
  
  <rect x="120" y="30" width="380" height="22" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="140" y="45" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">https://campus-hub.university.edu/student-portal</text>

  <!-- Top Navigation in UI -->
  <rect x="20" y="60" width="760" height="50" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="45" y="90" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="bold" font-size="15">CAMPUS RESOURCE &amp; ATTENDANCE HUB</text>
  <text x="540" y="90" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Student ID: 2022-08942 | BSIT 4th Year</text>

  <!-- Content Grid -->
  <g transform="translate(45, 130)">
    <!-- QR / Attendance Card -->
    <rect x="0" y="0" width="220" height="320" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="bold" font-size="13">Digital Attendance Pass</text>
    
    <!-- QR Code Visual Placeholder -->
    <rect x="35" y="55" width="150" height="150" rx="8" fill="#ffffff"/>
    <!-- Simulated QR pattern -->
    <rect x="45" y="65" width="35" height="35" fill="#0f172a"/>
    <rect x="52" y="72" width="21" height="21" fill="#ffffff"/>
    <rect x="140" y="65" width="35" height="35" fill="#0f172a"/>
    <rect x="147" y="72" width="21" height="21" fill="#ffffff"/>
    <rect x="45" y="160" width="35" height="35" fill="#0f172a"/>
    <rect x="52" y="167" width="21" height="21" fill="#ffffff"/>
    <rect x="95" y="75" width="30" height="20" fill="#0f172a"/>
    <rect x="95" y="110" width="50" height="30" fill="#0f172a"/>
    <rect x="145" y="150" width="30" height="35" fill="#0f172a"/>
    
    <rect x="25" y="225" width="170" height="32" rx="6" fill="#0369a1"/>
    <text x="110" y="246" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Scan In Campus</text>
    <text x="110" y="280" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Status: ACTIVE VERIFIED</text>

    <!-- Lab & Resource Booking Card -->
    <g transform="translate(245, 0)">
      <rect x="0" y="0" width="465" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="30" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="bold" font-size="14">IT Lab Equipment &amp; Facility Reservation</text>
      
      <rect x="20" y="50" width="130" height="80" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="35" y="75" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Lab Room 304</text>
      <text x="35" y="98" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">Reserved</text>
      <text x="35" y="118" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">1:00 PM - 3:00 PM</text>

      <rect x="165" y="50" width="130" height="80" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="180" y="75" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Cisco Router Rig</text>
      <text x="180" y="98" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">Available</text>
      <text x="180" y="118" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Slot 4 Ready</text>

      <rect x="310" y="50" width="135" height="80" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="325" y="75" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Linux Server VM</text>
      <text x="325" y="98" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">Provisioned</text>
      <text x="325" y="118" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Port 8080 Active</text>
    </g>

    <!-- Academic Schedule / Class Tracker -->
    <g transform="translate(245, 170)">
      <rect x="0" y="0" width="465" height="150" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="28" fill="#e2e8f0" font-family="'Inter', sans-serif" font-weight="bold" font-size="13">Today's Class Schedule &amp; Lecture Materials</text>
      
      <rect x="20" y="45" width="425" height="40" rx="6" fill="#1e293b"/>
      <text x="35" y="70" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12">IT 412: Web Systems &amp; Technologies II</text>
      <text x="340" y="70" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="11">Room 402 • 09:00 AM</text>

      <rect x="20" y="95" width="425" height="40" rx="6" fill="#1e293b"/>
      <text x="35" y="120" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12">IT 415: Capstone Project 2</text>
      <text x="340" y="120" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="11">Lab 2 • 01:30 PM</text>
