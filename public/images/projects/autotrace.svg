<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAuto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(45, 212, 191, 0)" />
      <stop offset="50%" stop-color="rgba(45, 212, 191, 0.4)" />
      <stop offset="100%" stop-color="rgba(45, 212, 191, 0)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgAuto)"/>
  
  <!-- Browser Frame -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Header Bar -->
  <path d="M20 32 C20 25.37 25.37 20 32 20 L768 20 C774.63 20 780 25.37 780 32 L780 60 L20 60 Z" fill="#1e293b"/>
  <circle cx="45" cy="40" r="6" fill="#ef4444"/>
  <circle cx="65" cy="40" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="40" r="6" fill="#10b981"/>
  
  <rect x="120" y="30" width="450" height="22" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="140" y="45" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">https://autotrace.system/alpr/live-monitoring</text>

  <!-- System Banner in App -->
  <rect x="20" y="60" width="760" height="48" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="45" y="90" fill="#2dd4bf" font-family="'Inter', sans-serif" font-weight="extrabold" font-size="15">AUTOTRACE: AUTOMATED LICENSE PLATE RECOGNITION (ALPR)</text>
  <rect x="620" y="70" width="135" height="28" rx="6" fill="#065f46"/>
  <text x="687" y="88" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">● OCR ENGINE ACTIVE</text>

  <!-- Main Grid: Left is Video Camera Stream / Right is Detection Telemetry -->
  <g transform="translate(40, 125)">
    
    <!-- Left: Live Camera View Container -->
    <rect x="0" y="0" width="430" height="325" rx="10" fill="#030712" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Simulated Camera Feed Elements -->
    <path d="M40 260 L140 130 L290 130 L390 260 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/> <!-- Road Lane -->
    <path d="M110 220 L150 145 L280 145 L320 220 Z" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/> <!-- Vehicle Silhouette -->
    
    <!-- Vehicle Windshield & Lights -->
    <polygon points="160,150 270,150 295,185 135,185" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <ellipse cx="145" cy="205" rx="12" ry="6" fill="#fef08a"/>
    <ellipse cx="285" cy="205" rx="12" ry="6" fill="#fef08a"/>

    <!-- ALPR Detection Bounding Box on Plate -->
    <rect x="175" y="200" width="80" height="30" rx="3" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="215" y="220" fill="#0f172a" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="12" text-anchor="middle">ABC 1234</text>
    
    <!-- Green Bounding Corner Markers -->
    <path d="M165 190 L175 190 M165 190 L165 200" stroke="#2dd4bf" stroke-width="2.5" fill="none"/>
    <path d="M265 190 L255 190 M265 190 L265 200" stroke="#2dd4bf" stroke-width="2.5" fill="none"/>
    <path d="M165 240 L175 240 M165 240 L165 230" stroke="#2dd4bf" stroke-width="2.5" fill="none"/>
    <path d="M265 240 L255 240 M265 240 L265 230" stroke="#2dd4bf" stroke-width="2.5" fill="none"/>

    <!-- Scanning Line Effect -->
    <rect x="160" y="195" width="110" height="40" fill="url(#scanGrad)" />

    <!-- Camera HUD Info -->
    <text x="20" y="30" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="11">CAM 01: MAIN ENTRANCE GATE</text>
    <text x="20" y="50" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">FPS: 30.0 | RES: 1080p | LATENCY: 28ms</text>
    <text x="20" y="305" fill="#fde047" font-family="'JetBrains Mono', monospace" font-size="11">● DETECTED: [ABC 1234] - CONFIDENCE: 98.4%</text>

    <!-- Right: Telemetry, Plate Extraction & Database Verification -->
    <g transform="translate(450, 0)">
      
      <!-- Current Recognized Plate Card -->
      <rect x="0" y="0" width="270" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="25" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="bold">LAST EXTRACTED PLATE</text>
      
      <!-- Plate Badge View -->
      <rect x="15" y="38" width="240" height="55" rx="6" fill="#f8fafc" stroke="#090d16" stroke-width="2"/>
      <text x="135" y="65" fill="#0f172a" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="extrabold" text-anchor="middle">ABC 1234</text>
      <text x="135" y="83" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">REGION III - CENTRAL LUZON</text>

      <rect x="15" y="105" width="110" height="32" rx="4" fill="#065f46"/>
      <text x="70" y="125" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">REGISTERED PASS</text>

      <rect x="135" y="105" width="120" height="32" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="195" y="125" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">BARRIER OPEN</text>

      <!-- Log Table / History -->
      <g transform="translate(0, 165)">
        <rect x="0" y="0" width="270" height="160" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="15" y="25" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="bold">Recent Vehicle Access Logs</text>
        
        <line x1="15" y1="38" x2="255" y2="38" stroke="#334155" stroke-width="1"/>
        
        <!-- Row 1 -->
        <text x="15" y="58" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">ABC 1234</text>
        <text x="120" y="58" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">08:42:15 AM</text>
        <text x="210" y="58" fill="#34d399" font-family="'Inter', sans-serif" font-size="10">Authorized</text>

        <!-- Row 2 -->
        <line x1="15" y1="72" x2="255" y2="72" stroke="#1e293b" stroke-width="1"/>
        <text x="15" y="92" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">NGB 8942</text>
        <text x="120" y="92" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">08:39:02 AM</text>
        <text x="210" y="92" fill="#34d399" font-family="'Inter', sans-serif" font-size="10">Authorized</text>

        <!-- Row 3 -->
        <line x1="15" y1="106" x2="255" y2="106" stroke="#1e293b" stroke-width="1"/>
        <text x="15" y="126" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">CAS 4410</text>
        <text x="120" y="126" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">08:35:41 AM</text>
        <text x="210" y="126" fill="#fde047" font-family="'Inter', sans-serif" font-size="10">Visitor</text>

        <!-- Row 4 -->
        <line x1="15" y1="140" x2="255" y2="140" stroke="#1e293b" stroke-width="1"/>
        <text x="15" y="152" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Total Today: 184 vehicles logged</text>
      </g>
    </g>

  </g>
</svg>
